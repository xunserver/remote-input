name: Deploy sender to GitHub Pages branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-client-pages.yml"
      - "apps/client/**"
      - "packages/device-protocol/**"
      - "packages/protocol/**"
      - "packages/sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sender
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm turbo run build --filter=@remote-input/client

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/client/dist
          force_orphan: true
